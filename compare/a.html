<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colors */
    --color-primary: #3182f6;
    --surface-page: #f2f4f6;
    --surface-card: #ffffff;
    --text-primary: #191f28;
    --text-secondary: #4e5968;
    --text-muted: #8b95a1;
    --text-on-primary: #ffffff;
    --label-blue-soft: #e8f3ff;
    --label-green-soft: #e3f8ec;
    --label-orange-soft: #fff1e5;
    --label-pink-soft: #ffeaf1;

    /* Spacing */
    --space-4: 4px;
    --space-8: 8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-20: 20px;
    --space-24: 24px;
    --space-34: 34px;
    --space-64: 64px;

    /* Radius */
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-xl: 24px;
    --radius-full: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--surface-page); }

  body {
    font-family: "Noto Sans KR", sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* Text styles */
  .heading-xl { font-size: 28px; font-weight: 700; line-height: 38px; letter-spacing: -0.8px; }
  .title-md   { font-size: 17px; font-weight: 700; line-height: 24px; letter-spacing: -0.3px; }
  .label-md   { font-size: 15px; font-weight: 700; line-height: 22px; letter-spacing: -0.2px; }
  .button-md  { font-size: 17px; font-weight: 700; line-height: 24px; letter-spacing: -0.2px; }
  .body-sm    { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: -0.1px; }
  .caption-md { font-size: 15px; font-weight: 500; line-height: 22px; letter-spacing: -0.2px; }
  .caption-sm { font-size: 13px; font-weight: 500; line-height: 18px; letter-spacing: 0; }

  /* Screen */
  .screen {
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    width: 100%;
    max-width: 390px;
    min-height: 100dvh;
    margin: 0 auto;
    padding: var(--space-64) var(--space-16) var(--space-34);
    background: var(--surface-page);
  }

  .main {
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    flex: 1 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
    padding: 0 var(--space-8);
  }
  .header__date { color: var(--text-muted); }
  .header__count { color: var(--color-primary); }

  /* Filter */
  .filter {
    display: flex;
    gap: var(--space-8);
    padding: 0 var(--space-4);
  }
  .chip {
    display: flex;
    align-items: center;
    height: 36px;
    padding: 0 var(--space-16);
    border-radius: var(--radius-full);
    background: var(--surface-card);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] {
    background: var(--color-primary);
    color: var(--text-on-primary);
  }

  /* Card */
  .card {
    display: flex;
    flex-direction: column;
    padding: var(--space-8) 0;
    border-radius: var(--radius-xl);
    background: var(--surface-card);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    height: 40px;
    padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
  }
  .card-header__title { flex: 1 0 0; min-width: 0; }
  .card-header__icon { display: block; flex-shrink: 0; }
  .card-header__action {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    color: var(--text-muted);
    text-decoration: none;
    white-space: nowrap;
  }

  /* Memo item */
  .memo-item {
    display: flex;
    align-items: center;
    gap: var(--space-16);
    width: 100%;
    height: 72px;
    padding: var(--space-12) var(--space-20);
    color: inherit;
    text-decoration: none;
  }
  .memo-item__tile {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
  }
  .memo-item__tile img { display: block; }
  .memo-item__tile--blue   { background: var(--label-blue-soft); }
  .memo-item__tile--green  { background: var(--label-green-soft); }
  .memo-item__tile--orange { background: var(--label-orange-soft); }
  .memo-item__tile--pink   { background: var(--label-pink-soft); }
  .memo-item__content {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    flex: 1 0 0;
    min-width: 0;
  }
  .memo-item__preview {
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .memo-item__date {
    flex-shrink: 0;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* Primary button: 화면 아래에 붙어 있다 */
  .button-primary {
    position: sticky;
    bottom: var(--space-34);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-8);
    width: 100%;
    height: 56px;
    padding: 0 var(--space-24);
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: var(--text-on-primary);
  }
  .button-primary img { display: block; }
</style>
</head>
<body>
  <div class="screen">
    <main class="main">
      <header class="header">
        <p class="header__date caption-md">10월 30일 금요일</p>
        <h1 class="heading-xl">오늘까지 메모를<br><span class="header__count">128개</span> 남겼어요</h1>
      </header>

      <nav class="filter" aria-label="분류">
        <button class="chip label-md" type="button" aria-pressed="true">전체</button>
        <button class="chip label-md" type="button" aria-pressed="false">업무</button>
        <button class="chip label-md" type="button" aria-pressed="false">개인</button>
        <button class="chip label-md" type="button" aria-pressed="false">아이디어</button>
      </nav>

      <section class="card" aria-labelledby="pinned-title">
        <div class="card-header">
          <img class="card-header__icon" src="assets/icon-pin.svg" width="16" height="16" alt="">
          <h2 id="pinned-title" class="card-header__title label-md">고정한 메모</h2>
        </div>
        <a class="memo-item" href="#">
          <span class="memo-item__tile memo-item__tile--blue"><img src="assets/icon-note-blue.svg" width="22" height="22" alt=""></span>
          <span class="memo-item__content">
            <span class="title-md">디자인 리뷰 회의록</span>
            <span class="memo-item__preview body-sm">검수 기준과 다음 할 일 정리</span>
          </span>
          <span class="memo-item__date caption-sm">오늘</span>
        </a>
        <a class="memo-item" href="#">
          <span class="memo-item__tile memo-item__tile--green"><img src="assets/icon-note-green.svg" width="22" height="22" alt=""></span>
          <span class="memo-item__content">
            <span class="title-md">주말 등산 준비</span>
            <span class="memo-item__preview body-sm">물 두 병, 간식, 바람막이 챙기기</span>
          </span>
          <span class="memo-item__date caption-sm">어제</span>
        </a>
      </section>

      <section class="card" aria-labelledby="recent-title">
        <div class="card-header">
          <h2 id="recent-title" class="card-header__title label-md">최근 메모</h2>
          <a class="card-header__action caption-md" href="#">
            전체 보기
            <img src="assets/icon-chevron-right.svg" width="16" height="16" alt="">
          </a>
        </div>
        <a class="memo-item" href="#">
          <span class="memo-item__tile memo-item__tile--pink"><img src="assets/icon-note-pink.svg" width="22" height="22" alt=""></span>
          <span class="memo-item__content">
            <span class="title-md">장보기 목록</span>
            <span class="memo-item__preview body-sm">우유, 계란, 사과, 커피 원두</span>
          </span>
          <span class="memo-item__date caption-sm">오늘</span>
        </a>
        <a class="memo-item" href="#">
          <span class="memo-item__tile memo-item__tile--orange"><img src="assets/icon-note-orange.svg" width="22" height="22" alt=""></span>
          <span class="memo-item__content">
            <span class="title-md">앱 아이콘 아이디어</span>
            <span class="memo-item__preview body-sm">메모지 모서리가 접힌 모양</span>
          </span>
          <span class="memo-item__date caption-sm">오늘</span>
        </a>
        <a class="memo-item" href="#">
          <span class="memo-item__tile memo-item__tile--green"><img src="assets/icon-note-green.svg" width="22" height="22" alt=""></span>
          <span class="memo-item__content">
            <span class="title-md">읽을 책</span>
            <span class="memo-item__preview body-sm">디자인 시스템 책 두 권</span>
          </span>
          <span class="memo-item__date caption-sm">어제</span>
        </a>
      </section>
    </main>

    <button class="button-primary button-md" type="button">
      <img src="assets/icon-plus.svg" width="20" height="20" alt="">
      새 메모 쓰기
    </button>
  </div>

  <script>
    // 분류 칩: 고른 칩 하나만 Selected
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
      });
    });
  </script>
</body>
</html>
