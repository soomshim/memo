<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>짝꿍 찾기 — 이모지 메모리 게임</title>
  <style>
    :root {
      --bg-1: #fff8ef;
      --bg-2: #f1ecff;
      --ink: #3d3551;
      --muted: #8a82a0;
      --card: #ffffff;
      --accent: #ff7a8a;
      --accent-2: #ffa5b0;
      --accent-soft: #ffe4e8;
      --shadow: 0 6px 18px rgba(120, 100, 160, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--ink);
      font-family: "Jua", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    header { text-align: center; margin-bottom: 28px; }
    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    .sub { margin-top: 6px; color: var(--muted); font-size: 15px; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
    }
    .pill {
      padding: 9px 18px;
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--card);
      box-shadow: var(--shadow);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, color 0.15s;
    }
    .pill:hover { transform: translateY(-2px); }
    .pill[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .pill.ghost { border-color: var(--accent-2); background: transparent; box-shadow: none; color: var(--accent); }
    .pill:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .stats {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      min-width: 96px;
      padding: 10px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      text-align: center;
    }
    .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    .stat small { color: var(--muted); font-size: 12px; }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--cols, 4), 1fr);
      gap: 14px;
      max-width: calc(var(--cols, 4) * 120px);
      margin: 0 auto;
    }

    .card {
      position: relative;
      aspect-ratio: 3 / 4;
      border: 0;
      background: none;
      perspective: 800px;
      cursor: pointer;
      border-radius: 18px;
    }
    .card .inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(.2, .8, .3, 1.2);
    }
    .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 18px;
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .back {
      background:
        radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.35) 0 6px, transparent 7px) 0 0 / 22px 22px,
        linear-gradient(145deg, var(--accent-2), var(--accent));
      color: #fff;
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 800;
    }
    .front {
      background: var(--card);
      font-size: clamp(30px, 6vw, 48px);
      transform: rotateY(180deg);
    }
    .card.matched { cursor: default; }
    .card.matched .front { background: var(--accent-soft); animation: pop 0.4s ease; }
    .card.wrong .front { animation: shake 0.35s ease; }

    @keyframes pop {
      50% { transform: rotateY(180deg) scale(1.1); }
    }
    @keyframes shake {
      25% { transform: rotateY(180deg) translateX(-5px); }
      75% { transform: rotateY(180deg) translateX(5px); }
    }

    /* 완료 모달 */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(61, 53, 81, 0.35);
      backdrop-filter: blur(4px);
    }
    .modal.open { display: grid; }
    .modal-box {
      width: min(360px, 100%);
      padding: 36px 28px;
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 20px 60px rgba(61, 53, 81, 0.25);
      text-align: center;
      animation: rise 0.35s ease;
    }
    .modal-box .emoji { font-size: 56px; }
    .modal-box h2 { margin: 8px 0 6px; font-size: 26px; }
    .modal-box p { margin-bottom: 24px; color: var(--muted); }
    @keyframes rise { from { transform: translateY(20px); opacity: 0; } }

    @media (max-width: 600px) {
      .wrap { padding: 28px 12px 40px; }
      .board { gap: 8px; }
      .card, .face { border-radius: 12px; }
      .stat { min-width: 80px; padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>짝꿍 <span>찾기</span> 🃏</h1>
      <p class="sub">카드를 뒤집어 같은 그림 두 장을 찾아보세요!</p>
      <div class="controls" id="levels">
        <button class="pill" data-level="easy" aria-pressed="false">쉬움</button>
        <button class="pill" data-level="normal" aria-pressed="true">보통</button>
        <button class="pill" data-level="hard" aria-pressed="false">어려움</button>
        <button class="pill ghost" id="restart">새 게임</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><b id="moves">0</b><small>시도</small></div>
      <div class="stat"><b id="pairs">0 / 8</b><small>맞춘 쌍</small></div>
      <div class="stat"><b id="time">0:00</b><small>시간</small></div>
    </div>

    <main class="board" id="board"></main>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="emoji">🎉</div>
      <h2 id="modal-title">모두 찾았어요!</h2>
      <p id="result"></p>
      <button class="pill" aria-pressed="true" id="again">다시 하기</button>
    </div>
  </div>

  <script>
    const LEVELS = {
      easy:   { cols: 4, pairs: 6 },
      normal: { cols: 4, pairs: 8 },
      hard:   { cols: 6, pairs: 12 },
    };
    const EMOJIS = ['🐶', '🐱', '🦊', '🐼', '🐸', '🐵', '🦁', '🐰', '🐻', '🐨', '🐯', '🐷', '🐙', '🦄', '🐥', '🐢'];
    const MISMATCH_DELAY = 800;

    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const pairsEl = document.getElementById('pairs');
    const timeEl = document.getElementById('time');
    const modal = document.getElementById('modal');

    let level = 'normal';
    let first = null, second = null, lock = false;
    let moves = 0, matched = 0;
    let seconds = 0, timer = null;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(s) {
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function updateStats() {
      movesEl.textContent = moves;
      pairsEl.textContent = `${matched} / ${LEVELS[level].pairs}`;
      timeEl.textContent = formatTime(seconds);
    }

    function startTimer() {
      if (timer) return;
      timer = setInterval(() => { seconds++; updateStats(); }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function newGame() {
      stopTimer();
      first = second = null;
      lock = false;
      moves = matched = seconds = 0;
      modal.classList.remove('open');

      const { cols, pairs } = LEVELS[level];
      const picks = shuffle([...EMOJIS]).slice(0, pairs);
      const deck = shuffle([...picks, ...picks]);

      board.style.setProperty('--cols', cols);
      board.innerHTML = '';
      deck.forEach((emoji) => {
        const card = document.createElement('button');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.setAttribute('aria-label', '뒤집힌 카드');
        card.innerHTML = `<div class="inner"><div class="face back">?</div><div class="face front">${emoji}</div></div>`;
        card.addEventListener('click', () => flip(card));
        board.appendChild(card);
      });
      updateStats();
    }

    function flip(card) {
      if (lock || card === first || card.classList.contains('matched')) return;
      startTimer();
      card.classList.add('flipped');
      card.setAttribute('aria-label', card.dataset.emoji);

      if (!first) { first = card; return; }
      second = card;
      moves++;

      if (first.dataset.emoji === second.dataset.emoji) {
        first.classList.add('matched');
        second.classList.add('matched');
        matched++;
        first = second = null;
        updateStats();
        if (matched === LEVELS[level].pairs) finish();
      } else {
        lock = true;
        first.classList.add('wrong');
        second.classList.add('wrong');
        updateStats();
        setTimeout(() => {
          [first, second].forEach((c) => {
            c.classList.remove('flipped', 'wrong');
            c.setAttribute('aria-label', '뒤집힌 카드');
          });
          first = second = null;
          lock = false;
        }, MISMATCH_DELAY);
      }
    }

    function finish() {
      stopTimer();
      document.getElementById('result').textContent = `${moves}번 시도, ${formatTime(seconds)} 걸렸어요.`;
      setTimeout(() => {
        modal.classList.add('open');
        document.getElementById('again').focus();
      }, 500);
    }

    document.getElementById('levels').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-level]');
      if (!btn) return;
      level = btn.dataset.level;
      document.querySelectorAll('[data-level]').forEach((b) => b.setAttribute('aria-pressed', b === btn));
      newGame();
    });
    document.getElementById('restart').addEventListener('click', newGame);
    document.getElementById('again').addEventListener('click', newGame);

    newGame();
  </script>
</body>
</html>
